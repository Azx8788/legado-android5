name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      # Keystore and passwords come from Actions secrets; nothing sensitive is committed.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is empty; building unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/legado.keystore
          {
            echo ""
            echo "RELEASE_STORE_FILE=./legado.keystore"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble appRelease
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --build-cache --parallel --warning-mode all

      - name: Organize APKs
        run: |
          mkdir -p "${{ github.workspace }}/apk"
          for file in app/build/outputs/apk/*/*/*.apk; do
            [ -f "$file" ] || continue
            base=$(basename "$file" .apk)
            abi=$(echo "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64' || true)
            [ -z "$abi" ] && abi="universal"
            cp "$file" "${{ github.workspace }}/apk/legado-android5_${abi}.apk"
          done
          ls -lh "${{ github.workspace }}/apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-android5-apk
          path: ${{ github.workspace }}/apk/*.apk
          retention-days: 30